[package]
name = "sctt-gpu"
version = "0.1.0"
edition = "2021"

[dependencies]
wgpu = "0.19"
bytemuck = { version = "1.14", features = ["derive"] }
flume = "0.11"
tokio = { version = "1.35", features = ["full"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["console"] }

[dev-dependencies]
tokio-test = "0.4"