[workspace]
resolver = "2"
members = [
    "sctt-core",
    "sctt-checker", 
    "sctt-smooth",
    "sctt-arc",
    "sctt-wasm",
    "sctt-gpu",
    "sctt-proof",
    "sctt-physics",
    "sctt-web",
    "sctt-cli",
    "sctt-server",
    "sctt-examples",
    "sctt-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["SCTT Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/TensorHusker/SCTT"
description = "Smooth Cubical Type Theory - The Next Generation Type System"

[workspace.dependencies]
# Core Rust utilities
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
hashbrown = "0.14"
fxhash = "0.2"
smallvec = "1.11"
bitvec = "1.0"
bumpalo = "3.14"

# Parallel processing
rayon = "1.8"
crossbeam = "0.8"
parking_lot = "0.12"

# Numerics and computation
num-traits = "0.2"
num-bigint = "0.4"
nalgebra = "0.32"
approx = "0.5"

# Performance profiling
criterion = "0.5"
pprof = { version = "0.13", features = ["criterion", "flamegraph"] }

# Testing
proptest = "1.4"
quickcheck = "1.0"

# WASM compilation
wasm-bindgen = { version = "0.2", features = ["serde-serialize"] }
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"

# GPU compute
wgpu = "0.19"
bytemuck = { version = "1.14", features = ["derive"] }

# Async runtime
tokio = { version = "1.35", features = ["full"] }
futures = "0.3"

# Web framework
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = "0.3"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "sqlite", "chrono"] }

# Visualization
egui = "0.24"
eframe = "0.24"
plotters = { version = "0.3", default-features = false }

# Cryptography
blake3 = "1.5"
ed25519-dalek = "2.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
split-debuginfo = "unpacked"

[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
panic = "abort"
debug = false

[profile.bench]
opt-level = 3
lto = true
codegen-units = 1
debug = false